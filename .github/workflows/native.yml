name: Native builds and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize repeated runs for a ref: do not interrupt a release while uploading.
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The Flutter version lives in .github/actions/flutter (single source of truth);
# a workflow-level copy would silently drift from the SDK actually installed.

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/flutter
      # The desktop OCR test drives the real Tesseract binary; without it the
      # test is skipped and the decode path would go unverified in CI.
      - name: Install Tesseract for the desktop OCR test
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  android:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37, build tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools' \
            'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: ./.github/actions/flutter
      # `secrets` is not a legal context in `if:`, so the emptiness check runs
      # inside the step. Only the keystore path is exported; passwords stay in
      # the build step's own environment.
      - name: Decode release keystore (tag pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No Android keystore secret is configured; building debug-signed artifacts.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name must be set together with ANDROID_KEYSTORE_BASE64." >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "CI_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Build APKs and App Bundle
        env:
          # Never load signing material for PRs, branches, or manual dispatches.
          CI_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          CI_ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
          CI_ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release
          python3 tool/release/package.py android
          if [ -n "$CI_ANDROID_KEYSTORE_PATH" ]; then
            echo release-signed > dist/ANDROID-SIGNING.txt
          else
            echo debug-signed > dist/ANDROID-SIGNING.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: dist/*
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/flutter
      - name: Install packaging and OCR tools
        shell: pwsh
        run: |
          # The runner image already carries Visual Studio with the C++ desktop
          # workload, so only the packager and the OCR engine are added here.
          # Choco has no 6.4.3 release; pin a version that exists or take latest.
          choco install innosetup --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          choco install tesseract --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract installation failed' }
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package installer, portable archive and bundled OCR
        shell: pwsh
        run: |
          ./tool/release/windows.ps1
          python tool/release/package.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build and runtime dependencies
        run: |
          sudo apt-get update
          # No libstdc++-12-dev on 24.04; g++ pulls the matching C++ runtime,
          # and media_kit needs libmpv plus a PulseAudio daemon for playback.
          sudo apt-get install -y clang cmake ninja-build pkg-config g++ \
            libgtk-3-dev libsecret-1-dev liblzma-dev libmpv-dev mpv \
            pulseaudio pulseaudio-utils ffmpeg tesseract-ocr tesseract-ocr-eng \
            xvfb dbus-x11
      - uses: ./.github/actions/flutter
      - name: Build Linux release
        run: flutter build linux --release
      - name: Package Debian and full-bundle tarball
        run: python3 tool/release/package.py linux
      - name: Smoke launch Debian-installed executable under Xvfb
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a dbus-run-session -- python3 tool/release/smoke.py /opt/mindpocket/mindpocket
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - uses: ./.github/actions/flutter
      - name: Install CocoaPods dependencies
        # Unabridged `flutter build macos` produces a release with distribution
        # signing attempted; this job wants an unsigned but complete bundle, so
        # generate the Flutter config, install pods, then build with xcodebuild.
        run: |
          flutter build macos --release --config-only
          pod install --project-directory=macos
      - name: Build macOS release without distribution signing
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath build/macos-release \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package and verify the macOS application bundle
        run: python3 tool/release/package.py macos
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/*
          if-no-files-found: error

  ios:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - uses: ./.github/actions/flutter
      - name: Compile unsigned iOS release
        run: flutter build ios --release --no-codesign
      - name: Package compilation artifact (not an installable IPA)
        run: python3 tool/release/package.py ios
      # `secrets` is not a legal context in `if:`; ios-sign.sh requires all four
      # variables itself, so skipping happens here on the empty certificate.
      - name: Sign an installable IPA when Apple signing secrets exist
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          if [ -z "$IOS_CERTIFICATE_BASE64" ]; then
            echo 'No Apple signing secrets are configured; keeping the unsigned compilation archive only.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash tool/release/ios-sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, android, windows, linux, macos, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Aggregate checksums and publish atomically from a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/release/publish.py
